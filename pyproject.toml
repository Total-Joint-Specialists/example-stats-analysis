[project]
name = "tjs-stats-tutorials"
version = "0.1.0"
description = "Python environment for the TJS statistics tutorial site"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.12",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
